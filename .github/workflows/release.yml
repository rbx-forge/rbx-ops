name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: rbx-ops
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: rbx-ops.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: rbx-ops
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      # `--locked` matters more here than anywhere in ci.yml: without it cargo
      # may rewrite Cargo.lock mid-build, and the archive people download would
      # come from a dependency graph no test run exercised.
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin rbx-ops
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          zip ../../../rbx-ops-${{ github.ref_name }}-${{ matrix.target }}.zip ${{ matrix.bin }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.bin }} -DestinationPath ../../../rbx-ops-${{ github.ref_name }}-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bins-${{ matrix.target }}
          path: rbx-ops-*.zip

  release:
    name: Create Release
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          merge-multiple: true
      - name: Generate SHA256 checksums
        run: sha256sum rbx-ops-*.zip > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: |
            rbx-ops-*.zip
            SHA256SUMS
