name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

# The build runs with read access only. The job that publishes asks for what
# it needs, so a compromised build step cannot write to the repository or mint
# an attestation.
permissions:
  contents: read

jobs:
  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: rbx-ops
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: rbx-ops.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: rbx-ops
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      # `--locked` matters more here than anywhere in ci.yml: without it cargo
      # may rewrite Cargo.lock mid-build, and the archive people download would
      # come from a dependency graph no test run exercised.
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin rbx-ops
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          zip ../../../rbx-ops-${{ github.ref_name }}-${{ matrix.target }}.zip ${{ matrix.bin }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.bin }} -DestinationPath ../../../rbx-ops-${{ github.ref_name }}-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bins-${{ matrix.target }}
          path: rbx-ops-*.zip

  release:
    name: Create Release
    needs: build-release
    permissions:
      contents: write
      # Both are what `actions/attest-build-provenance` needs: an OIDC token to
      # sign with, and the right to store the attestation.
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The release body is the CHANGELOG section for this tag, so the notes and
      # the changelog cannot say two different things. A tag with no section
      # fails here, before anything is published.
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { inside = 1; next }
            inside && /^## \[/           { exit }
            inside                       { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no '## [$version]' section" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          merge-multiple: true
      - name: Generate SHA256 checksums
        run: sha256sum rbx-ops-*.zip > SHA256SUMS
      # `gh attestation verify <zip> --repo rbx-forge/rbx-ops` proves the archive
      # was built here, from this tag.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rbx-ops-*.zip
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          body_path: release-notes.md
          files: |
            rbx-ops-*.zip
            SHA256SUMS
