name: Docs

# Publishes https://rbx-forge.github.io/rbx-ops/ from `docs/`. Nothing rendered
# is committed: this workflow is the only thing that turns `docs/` into HTML.
#
# Depends on one repository setting: Settings > Pages > Source must be
# "GitHub Actions".
on:
  push:
    branches: [main]
  # Build without deploying on PRs that touch the site, so a broken link or
  # anchor fails the PR (`strict: true` in mkdocs.yml).
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Read-only by default, and so for the build job, which runs `pip install`:
# whatever a package runs at install time gets this token. Only the deploy job
# asks for more.
permissions:
  contents: read

# Never cancel a deployment in flight: a half-published site is a broken one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - run: pip install -r requirements-docs.txt

      - run: mkdocs build --strict

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `pages: write` is the deployment; `id-token: write` is how deploy-pages
    # proves the artifact came from this run. This job runs no code from the
    # repository or from a package index.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
