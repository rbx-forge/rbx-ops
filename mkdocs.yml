# The documentation site published at https://rbx-forge.github.io/rbx-ops/
# by .github/workflows/docs.yml. `docs_dir` is `docs/` in place: the site and
# the repository serve the same files.

site_name: rbx-ops
site_description: Operate a live Roblox experience from the command line.
site_url: https://rbx-forge.github.io/rbx-ops/
repo_url: https://github.com/rbx-forge/rbx-ops
repo_name: rbx-forge/rbx-ops
edit_uri: edit/main/docs/
copyright: MPL-2.0

docs_dir: docs
site_dir: site

# A missing nav file, a broken link or a link to a heading that does not exist
# fails the build.
strict: true
validation:
  anchors: warn

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Follow the system

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rbx-forge/rbx-ops
      name: rbx-ops on GitHub

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Commands:
      - servers: servers.md
      - analytics: analytics.md
      - ban: ban.md
      - group: group.md
      - restart: restart.md
      - data: data.md
      - memorystore: memorystore.md
      - message: message.md
      - secret: secret.md
      - ads: ads.md
      - user: user.md
  - Reference:
      - Configuration: reference/configuration.md
      - API keys and scopes: reference/scopes.md
      - Safety model: reference/safety.md
      - JSON output: reference/json.md
